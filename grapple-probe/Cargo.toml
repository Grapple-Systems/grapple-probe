[package]
name = "grapple-probe"
version = "0.1.0"
authors = [
    "Jonathan Herbst <jonathan.herbst@grapple.systems>",
    "Seth Pierson <seth.pierson@grapple.systems>",
]
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
std = ["nusb"]

[dependencies]
nusb = { version = "0.2.1", optional = true }
num_enum = { version = "0.7.5", default-features = false }
packet-gen = { version = "0.1", path = "../packet-gen" }
