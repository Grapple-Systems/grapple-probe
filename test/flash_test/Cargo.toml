[package]
name = "flash_test"
version = "0.1.0"
authors = [
    "Jonathan Herbst <jonathan.herbst@grapple.systems>",
    "Seth Pierson <seth.pierson@grapple.systems>",
]
edition = "2024"
license = "Apache-2.0"

[dependencies]
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
defmt = "0.3.0"
defmt-rtt = "0.4"
embassy-executor = { path = "../../embassy/embassy-executor", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-rp = { path = "../../embassy/embassy-rp", features = ["unstable-pac", "time-driver", "rp2040", "defmt"] }
embassy-time = { path = "../../embassy/embassy-time"}
panic-probe = { version = "0.3.2", features = ["print-defmt"] }
