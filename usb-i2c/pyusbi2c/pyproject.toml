[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyusbi2c"
version = "0.1.0"
description = "Library and cli for interacting with the i2c interface on a Grapple Probe"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "Jonathan Herbst", email = "jonathan.herbst@grapple.systems" },
    { name = "Seth Pierson", email = "seth.pierson@grapple.systems" },
]
dependencies = [
  "dpkt>=1.9.8,<1.10.0",
  "pyusb>=1.3.1,<1.4.0",
]

[tool.setuptools]
packages = ["pyusbi2c"]

[tool.setuptools.package-dir]
pyusbi2c = "."

[project.scripts]
usbi2c = "pyusbi2c.cli:main"
