[package]
name = "packet-gen"
version = "0.1.0"
authors = [
    "Jonathan Herbst <jonathan.herbst@grapple.systems>",
    "Seth Pierson <seth.pierson@grapple.systems>",
]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A procedural macro for generating zero-copy packet parsers"
repository = "https://github.com/Grapple-Systems/grapple-probe"
readme = "README.md"
keywords = ["embedded", "packet", "parser", "macro", "no-std"]
categories = ["embedded", "no-std", "parsing"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = "2.0.104"
