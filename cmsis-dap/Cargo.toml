[package]
name = "cmsis-dap"
version = "0.1.0"
authors = [
    "Jonathan Herbst <jonathan.herbst@grapple.systems>",
    "Seth Pierson <seth.pierson@grapple.systems>",
]
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
bbqueue = "0.5.1"
defmt = "1.0.1"
num_enum = { version = "0.7.3", default-features = false }
embassy-executor = { path = "../embassy/embassy-executor" }
embassy-futures = { path = "../embassy/embassy-futures" }
embassy-rp = { path = "../embassy/embassy-rp", optional = true, features = ["unstable-pac"] }
embassy-sync = { path = "../embassy/embassy-sync" }
embassy-time = { path = "../embassy/embassy-time" }
embassy-usb = { path = "../embassy/embassy-usb" }
embassy-usb-driver = { path = "../embassy/embassy-usb-driver" }
embedded-io-async = "0.7.0"
replace_with = { version = "0.1.7", default-features = false, features = ["panic_abort"] }

[features]
rp = ["dep:embassy-rp"]

[dev-dependencies]
bitbuffer = "0.11.0"
embassy-executor = { path = "../embassy/embassy-executor", features = ["arch-std", "executor-thread"] }
embassy-time = { path = "../embassy/embassy-time", features = ["std", "defmt-timestamp-uptime", "generic-queue-128"]}
mockall = "0.13.0"
tokio = { version = "1.41", features = ["rt", "macros"]}