name: Grapple Probe Firmware Release

on:
  push:
    tags:
      - 'grapple-probe-firmware-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    uses: ./.github/workflows/grapple-probe-firmware-build-test.yml

  release:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: grapple-probe-fw
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt install -y yq
          VERSION=$(tomlq -r '.package.version' grapple-probe-firmware/Cargo.toml)
          gh release create "gpfw-${{ github.ref }}" \
            --draft \
            --title "Grapple Probe Firmware ${VERSION}"
          cp artifacts/grapple-probe-fw.uf2 "artifacts/grapple-probe-firmware-${VERSION}.uf2"
          gh release upload "gpfw-${{ github.ref }}" "artifacts/grapple-probe-firmware-${VERSION}.uf2" --clobber
