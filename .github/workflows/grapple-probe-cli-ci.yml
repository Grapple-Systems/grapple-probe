name: grapple-probe-cli-ci

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: linux-x86-64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86-64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Build
      working-directory: ./grapple-probe/cli
      run: cargo build --release --verbose --target ${{ matrix.target }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: grapple-probe-cli-${{ matrix.name }}
        path: ./grapple-probe/cli/target/${{ matrix.target }}/release/grapple-probe-cli