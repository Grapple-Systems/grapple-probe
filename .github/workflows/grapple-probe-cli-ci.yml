name: Grapple Probe CLI (CI)

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    strategy:
      matrix:
        include:
          - name: linux-x86-64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86-64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin

    uses: ./.github/workflows/grapple-probe-cli-build-test.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
