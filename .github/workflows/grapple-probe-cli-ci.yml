name: grapple-probe-cli-ci

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Build
      uses: Swatinem/rust-cache@v2
      working-directory: ./grapple-probe/cli
      run: cargo build --release --verbose