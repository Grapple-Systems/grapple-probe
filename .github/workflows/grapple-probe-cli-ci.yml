name: grapple-probe-cli-ci

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          grapple-probe/cli/target
        key: ${{ runner.os }}-cargo-grapple-probe-cli-${{ hashFiles('grapple-probe/cli/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-grapple-probe-cli-

    - name: Build
      working-directory: ./grapple-probe/cli
      run: cargo build --release --verbose