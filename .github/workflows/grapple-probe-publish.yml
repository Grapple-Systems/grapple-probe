name: Publish Grapple Probe to crates.io
on:
  push:
    tags:
      - 'grapple-probe-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v6
    - uses: rust-lang/crates-io-auth-action@v1
      working-directory: ./grapple-probe
      id: auth
    - run: cargo publish
      working-directory: ./grapple-probe
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}