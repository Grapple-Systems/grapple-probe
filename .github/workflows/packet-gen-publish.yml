name: Publish Packet Gen to crates.io
on:
  push:
    tags:
      - 'packet-gen-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v6
    - uses: rust-lang/crates-io-auth-action@v1
      working-directory: ./packet-gen
      id: auth
    - run: cargo publish
      working-directory: ./packet-gen
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}